
services:

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - currency-network

  forex-service:
    build:
      context: ./Kong-API-Gateway-and-Spring-Boot-Microservices/Spring-Boot-Micro-Forex-Service
      dockerfile: Dockerfile
    container_name: forex-service
    ports:
      - "8098:8098"
    depends_on:
      config-server:
        condition: service_healthy  
    networks:
      - currency-network

  currency-conversion-service:
    build:
      context: ./Kong-API-Gateway-and-Spring-Boot-Microservices/Spring-Boot-Micro-Currency-Conversion-Service
      dockerfile: Dockerfile
    container_name: currency-conversion-service
    ports:
      - "8099:8099"
    depends_on:
      forex-service:
        condition: service_started
      config-server:
        condition: service_healthy  
    networks:
      - currency-network

  kong:
    image: kong:3.9
    container_name: kong-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./kong:/etc/kong:ro
    depends_on:
      - forex-service
      - currency-conversion-service
    networks:
      - currency-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: currency-dashboard
    ports:
      - "3000:80"
    depends_on:
      - forex-service
      - currency-conversion-service
      - kong
    networks:
      - currency-network

networks:
  currency-network:
    driver: bridge
