
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /health/forex {
        proxy_pass http://forex-service:8098/actuator/health;
    }

    location = /health/conversion {
        proxy_pass http://currency-conversion-service:8099/actuator/health;
    }

    location = /health/kong {
        proxy_pass http://kong:8001/;
    }

    location /api/forex/ {
        proxy_pass http://kong:8000/currency-exchange/;
        proxy_set_header Host $host;
    }

    location /api/conversion/ {
        proxy_pass http://kong:8000/currency-converter/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
